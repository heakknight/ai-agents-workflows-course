[project]
name = "basic-ai-workflow"
version = "0.1.0"
description = "A basic OpenAI-powered text summarization workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.50.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
